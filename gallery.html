<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTSNS University Gallery - Journey Through Time</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ============================================
           ORIGINAL CSS (kept) + targeted fixes
        ============================================ */
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        :root{
            --bg-space:#030014;
            --bg-card:rgba(255,255,255,0.05);
            --text-primary:#ffffff;
            --text-secondary:rgba(255,255,255,0.6);
            --text-muted:rgba(255,255,255,0.3);
            --cyan:#06b6d4;
            --purple:#a855f7;
            --pink:#ec4899;
            --border:rgba(255,255,255,0.1);
            --font-display:'Playfair Display', serif;
            --font-body:'Inter', sans-serif;
            --track-baseline: 150; /* LOWERED baseline to push track down */
            --train-offset: 18;   /* tweak to make train sit on the track (px) */
        }

        html{ scroll-behavior:smooth; }
        body{ font-family:var(--font-body); background-color:var(--bg-space); color:var(--text-primary); line-height:1.6; overflow-x:hidden; }

        /* Stars */
        .stars-container{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; transform-origin:center center; }
        .star{ position:absolute; background:white; border-radius:50%; animation:twinkle var(--duration) ease-in-out infinite; animation-delay:var(--delay); opacity:0.85; filter:drop-shadow(0 0 4px rgba(255,255,255,0.08)); }
        @keyframes twinkle{ 0%,100%{opacity:0.2; transform:scale(1);} 50%{opacity:1; transform:scale(1.2);} }

        /* Nebula */
        .nebula{ position:fixed; border-radius:50%; filter:blur(100px); pointer-events:none; z-index:1; transform-origin:center center; will-change:transform; }
        .nebula-1{ top:0; left:25%; width:600px; height:600px; background:rgba(147,51,234,0.2); }
        .nebula-2{ bottom:0; right:25%; width:500px; height:500px; background:rgba(6,182,212,0.15); }
        .nebula-3{ top:50%; left:50%; transform:translate(-50%,-50%) rotate(45deg); width:800px; height:400px; background:rgba(59,130,246,0.1); }

        /* Hero */
        .hero{ position:relative; min-height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; z-index:10; }
        .cosmic-rings{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
        .cosmic-ring{ position:absolute; border:1px solid rgba(255,255,255,0.05); border-radius:50%; animation:rotate-ring linear infinite; }
        .cosmic-ring:nth-child(1){ width:350px; height:350px; animation-duration:30s; }
        .cosmic-ring:nth-child(2){ width:500px; height:500px; animation-duration:40s; animation-direction:reverse; }
        .cosmic-ring:nth-child(3){ width:650px; height:650px; animation-duration:50s; }
        @keyframes rotate-ring{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

        .hero-content{ position:relative; z-index:10; text-align:center; padding:2rem; max-width:900px; will-change:transform; }
        .hero-subtitle{ color:var(--cyan); font-size:.875rem; text-transform:uppercase; letter-spacing:.3em; font-weight:500; margin-bottom:1rem; opacity:0; animation:fadeInUp 1s ease forwards .2s; }
        .hero-title{ font-family:var(--font-display); font-size:clamp(2.5rem,10vw,7rem); font-weight:900; line-height:.9; margin-bottom:1.5rem; opacity:0; animation:fadeInUp 1s ease forwards .3s; }
        .hero-title .line-1{ display:block; background:linear-gradient(to right,#fff,#e9d5ff,#a5f3fc); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}
        .hero-title .line-2{ display:block; background:linear-gradient(to right,var(--cyan),var(--purple),var(--pink)); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}
        .hero-description{ color:var(--text-secondary); font-size:1.125rem; max-width:500px; margin:0 auto 3rem; opacity:0; animation:fadeInUp 1s ease forwards .5s; }
        .scroll-indicator{ display:flex; flex-direction:column; align-items:center; gap:1rem; opacity:0; animation:fadeInUp 1s ease forwards .7s; }
        .scroll-text{ color:rgba(6,182,212,0.8); font-size:.75rem; text-transform:uppercase; letter-spacing:.2em; }
        .scroll-mouse{ width:24px; height:40px; border:2px solid rgba(6,182,212,0.5); border-radius:12px; display:flex; justify-content:center; padding-top:8px; animation:pulse-opacity 2s ease infinite; }
        .scroll-dot{ width:6px; height:6px; background:var(--cyan); border-radius:50%; animation:scroll-bounce 1.5s ease infinite; }
        @keyframes fadeInUp{ from{opacity:0; transform:translateY(30px);} to{opacity:1; transform:translateY(0);} }
        @keyframes pulse-opacity{ 0%,100%{opacity:.5;} 50%{opacity:1;} }
        @keyframes scroll-bounce{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(12px);} }

        /* Year nav (kept) */
        .year-nav{ position:fixed; right:2rem; top:50%; transform:translateY(-50%); z-index:100; display:flex; flex-direction:column; gap:1rem; opacity:0; animation:fadeInRight 1s ease forwards 1s; }
        @keyframes fadeInRight{ from{opacity:0; transform:translateY(-50%) translateX(20px);} to{opacity:1; transform:translateY(-50%) translateX(0);} }
        .year-btn{ position:relative; background:none; border:none; color:var(--text-muted); font-size:.875rem; font-weight:700; font-family:var(--font-body); cursor:pointer; transition:all .3s ease; padding:.5rem; }
        .year-btn:hover, .year-btn.active{ color:var(--cyan); transform:scale(1.2); }
        .year-btn.active::before{ content:''; position:absolute; left:-1rem; top:50%; transform:translateY(-50%); width:8px; height:8px; background:var(--cyan); border-radius:50%; box-shadow:0 0 10px var(--cyan); }

        /* Filter section */
        .filter-section{ position:sticky; top:0; z-index:50; background:rgba(3,0,20,0.9); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:1rem 0; }
        .filter-container{ max-width:1400px; margin:0 auto; padding:0 1.5rem; display:flex; flex-wrap:wrap; align-items:center; gap:1rem; }
        .filter-label{ font-size:.75rem; text-transform:uppercase; letter-spacing:.15em; color:var(--text-muted); }
        .filter-buttons{ display:flex; flex-wrap:wrap; gap:.5rem; }
        .filter-btn{ padding:.5rem 1rem; border-radius:50px; border:none; background:rgba(255,255,255,0.05); color:var(--text-secondary); font-size:.875rem; font-weight:500; font-family:var(--font-body); cursor:pointer; transition:all .3s ease; }
        .filter-btn:hover{ background:rgba(255,255,255,0.1); color:var(--text-primary); }
        .filter-btn.active{ background:linear-gradient(to right,var(--cyan),var(--purple)); color:white; box-shadow:0 4px 20px rgba(6,182,212,0.3); }

        /* Timeline */
        .timeline-section{ position:relative; height:300vh; }
        .timeline-sticky{ position:sticky; top:0; height:100vh; overflow:hidden; }

        /* Track (moved down more) */
        .track-container{ position:absolute; top:66%; left:0; transform:translateY(-50%); height:360px; pointer-events:none; z-index:5; will-change:width; }
        .track-path{ fill:none; stroke-linecap:round; stroke-dasharray:10000; stroke-dashoffset:10000; transition:stroke-dashoffset .12s ease-out; }
        .track-glow{ stroke:url(#trackGlow); stroke-width:8; filter:blur(2px); opacity:.95; }
        .track-main{ stroke:url(#trackGradient); stroke-width:4; opacity:1; }

        /* Train */
        .train-container{ position:absolute; top:50%; z-index:30; pointer-events:none; transition:transform .12s linear; will-change:transform; }
        .train-glow{ position:absolute; inset:-20px; background:radial-gradient(circle, rgba(6,182,212,0.4) 0%, transparent 70%); border-radius:50%; z-index:-1; }
        .train-svg{ height:80px; width:auto; transform-origin:center center; transform:rotate(0deg); /* force 0deg */ filter:drop-shadow(0 0 20px rgba(168,85,247,0.4)) drop-shadow(0 0 30px rgba(6,182,212,0.5)); }

        /* Steam */
        .steam-container{ position:absolute; top:-60px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; }
        .steam-particle{ position:absolute; border-radius:50%; background:radial-gradient(circle, rgba(167,139,250,0.4) 0%, transparent 70%); animation:steam-rise 1.5s ease-out infinite; }
        .steam-particle:nth-child(1){ width:20px;height:20px; animation-delay:0s; }
        .steam-particle:nth-child(2){ width:30px;height:30px; animation-delay:.15s; }
        .steam-particle:nth-child(3){ width:40px;height:40px; animation-delay:.3s; }
        .steam-particle:nth-child(4){ width:50px;height:50px; animation-delay:.45s; }
        .steam-particle:nth-child(5){ width:60px;height:60px; animation-delay:.6s; }
        .steam-particle:nth-child(6){ width:70px;height:70px; animation-delay:.75s; }
        @keyframes steam-rise{ 0%{ transform:translateY(0) translateX(0) scale(.3); opacity:.6; } 100%{ transform:translateY(-80px) translateX(30px) scale(1.5); opacity:0; } }

        /* Horizontal content (pure horizontal transform, no mouse parallax overrides) */
        .horizontal-content{ position:absolute; top:0; left:0; height:100%; display:flex; align-items:center; transition:transform .12s linear; will-change:transform; }
        .spacer-start{ width:40vw; flex-shrink:0; }
        .spacer-end{ width:50vw; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
        .end-content{text-align:center;}
        .end-emoji{ font-size:4rem; margin-bottom:1.5rem; animation:float-rocket 3s ease-in-out infinite; }
        @keyframes float-rocket{ 0%,100%{transform:rotate(0deg) scale(1);} 25%{transform:rotate(10deg) scale(1.1);} 75%{transform:rotate(-10deg) scale(1.1);} }
        .end-text{ font-size:1.25rem; font-weight:500; background:linear-gradient(to right,var(--cyan),var(--purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }

        /* Year Section, Marker & glow */
        .year-section{ display:flex; align-items:center; flex-shrink:0; flex-direction:row; gap:1.25rem; align-items:flex-start; }
        .year-marker{ position:relative; display:flex; flex-direction:column; align-items:center; flex-shrink:0; margin:0 3rem; }
        .year-number{ font-family:var(--font-display); font-size:clamp(6rem,15vw,12rem); font-weight:900; background:linear-gradient(to bottom, rgba(255,255,255,0.1), transparent); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; user-select:none; line-height:1; transition:text-shadow .25s ease, transform .3s ease; }
        .year-number.glow{ text-shadow:0 4px 24px rgba(6,182,212,0.18),0 8px 40px rgba(168,85,247,0.08); transform:translateY(-6px) scale(1.02); }
        .year-orbit{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:120px; height:120px; border:1px solid rgba(6,182,212,0.2); border-radius:50%; animation:rotate-ring 10s linear infinite; }
        .year-orbit::after{ content:''; position:absolute; top:-4px; left:50%; transform:translateX(-50%); width:8px; height:8px; background:var(--cyan); border-radius:50%; box-shadow:0 0 10px var(--cyan); }

        /* Event Card */
        .event-card{ flex-shrink:0; margin:0 2rem; width:350px; background:linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%); border:1px solid var(--border); border-radius:1rem; overflow:hidden; backdrop-filter:blur(10px); transition:all .5s cubic-bezier(.4,0,.2,1); transform:translateY(50px); opacity:0; box-shadow:0 25px 50px -12px rgba(88,28,135,0.2); }
        .event-card.visible{ transform:translateY(0) rotateY(0); opacity:1; }
        .event-card:hover{ transform:translateY(-15px) rotateY(5deg) rotateX(-5deg); border-color:rgba(6,182,212,0.3); box-shadow:0 35px 60px -15px rgba(88,28,135,0.3); }
        @media (min-width:768px){ .event-card{ width:420px; } }

        /* Image Grid */
        .image-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:4px; padding:4px; }
        .image-item{ position:relative; overflow:hidden; cursor:pointer; aspect-ratio:1; }
        .image-item:first-child{ grid-column:span 2; grid-row:span 2; aspect-ratio:4/3; }
        .image-item img{ width:100%; height:100%; object-fit:cover; transition:transform .5s ease; }
        .image-item:hover img{ transform:scale(1.1); }
        .image-overlay{ position:absolute; inset:0; background:linear-gradient(to top, rgba(88,28,135,0.6), transparent); display:flex; align-items:flex-end; justify-content:center; padding-bottom:.5rem; opacity:0; transition:opacity .3s ease; }
        .image-item:hover .image-overlay{ opacity:1; }
        .image-overlay span{ color:rgba(255,255,255,0.9); font-size:.75rem; font-weight:500; }

        .event-info{ padding:1.25rem; }
        .event-meta{ display:flex; align-items:center; gap:.75rem; margin-bottom:.75rem; }
        .event-category{ padding:.25rem .75rem; border-radius:50px; font-size:.75rem; font-weight:600; border:1px solid; }
        .category-academic{ background:rgba(6,182,212,0.2); color:#22d3ee; border-color:rgba(6,182,212,0.3); }
        .category-cultural{ background:rgba(168,85,247,0.2); color:#c084fc; border-color:rgba(168,85,247,0.3); }
        .category-technology{ background:rgba(59,130,246,0.2); color:#60a5fa; border-color:rgba(59,130,246,0.3); }
        .category-sports{ background:rgba(16,185,129,0.2); color:#34d399; border-color:rgba(16,185,129,0.3); }
        .category-national{ background:rgba(245,158,11,0.2); color:#fbbf24; border-color:rgba(245,158,11,0.3); }
        .category-alumni{ background:rgba(244,63,94,0.2); color:#fb7185; border-color:rgba(244,63,94,0.3); }
        .event-date{ color:var(--text-muted); font-size:.875rem; }
        .event-title{ font-family:var(--font-display); font-size:1.25rem; font-weight:700; margin-bottom:.5rem; background:linear-gradient(to right,#fff,rgba(255,255,255,0.8)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; transition:all .3s ease; }
        .event-card:hover .event-title{ background:linear-gradient(to right,#67e8f9,#c4b5fd); -webkit-background-clip:text; background-clip:text; }
        .event-description{ color:var(--text-secondary); font-size:.875rem; margin-bottom:1rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .event-details{ display:flex; flex-wrap:wrap; gap:1rem; font-size:.75rem; color:var(--text-muted); }
        .event-detail{ display:flex; align-items:center; gap:.375rem; }
        .event-detail svg{ width:14px; height:14px; }
        .detail-calendar svg{ color:rgba(6,182,212,0.7); }
        .detail-location svg{ color:rgba(168,85,247,0.7); }
        .detail-attendees svg{ color:rgba(236,72,153,0.7); }

        /* Lightbox */
        .lightbox{ position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,0.98); backdrop-filter:blur(20px); display:flex; align-items:center; justify-content:center; opacity:0; visibility:hidden; transition:all .3s ease; }
        .lightbox.active{ opacity:1; visibility:visible; }
        .lightbox-close{ position:absolute; top:1.5rem; right:1.5rem; background:rgba(255,255,255,0.05); border:none; color:rgba(255,255,255,0.5); cursor:pointer; padding:.75rem; border-radius:50%; transition:all .3s ease; z-index:10; }
        .lightbox-close:hover{ background:rgba(255,255,255,0.1); color:white; }
        .lightbox-nav{ position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,0.05); border:none; color:rgba(255,255,255,0.5); cursor:pointer; padding:1rem; border-radius:50%; transition:all .3s ease; }
        .lightbox-nav:hover{ background:rgba(255,255,255,0.1); color:white; transform:translateY(-50%) scale(1.1); }
        .lightbox-prev{ left:1rem; } .lightbox-next{ right:1rem; }
        .lightbox-content{ position:relative; max-width:90vw; max-height:85vh; transform:scale(.9) translateY(30px); transition:transform .3s ease; }
        .lightbox.active .lightbox-content{ transform:scale(1) translateY(0); }
        .lightbox-image{ max-width:100%; max-height:85vh; object-fit:contain; border-radius:12px; box-shadow:0 25px 50px -12px rgba(88,28,135,0.3); }
        .lightbox-info{ position:absolute; bottom:0; left:0; right:0; padding:1.5rem; background:linear-gradient(transparent, rgba(0,0,0,0.9)); border-radius:0 0 12px 12px; }
        .lightbox-title{ font-family:var(--font-display); font-size:1.25rem; font-weight:700; margin-bottom:.75rem; }
        .lightbox-dots{ display:flex; gap:.5rem; }
        .lightbox-dot{ height:6px; width:6px; background:rgba(255,255,255,0.2); border-radius:3px; transition:all .3s ease; }
        .lightbox-dot.active{ width:24px; background:linear-gradient(to right,var(--cyan),var(--purple)); }

        /* Footer */
        .footer{ padding:4rem 1.5rem; text-align:center; border-top:1px solid var(--border); background:var(--bg-space); position:relative; z-index:20; }
        .footer-text{ font-size:.875rem; background:linear-gradient(to right, rgba(6,182,212,0.6), rgba(168,85,247,0.6)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .footer-subtext{ color:var(--text-muted); font-size:.75rem; margin-top:.5rem; }

        @media (max-width:767px){
            .year-nav{ display:none; }
            .year-marker{ margin:0 1.5rem; }
            .event-card{ margin:0 1rem; width:300px; }
            .hero-description{ font-size:1rem; }
        }

        .hidden{ display:none !important; }

        /* ensures events container is horizontal */
        #eventsContainer{ display:flex; align-items:center; gap:2rem; will-change:transform; }
        @media (min-width:1100px){ #eventsContainer{ gap:2.6rem; } .year-marker{ margin:0 3.5rem; } .event-card{ margin:0 2.5rem; } }

        /* Parallax helper classes (we removed horizontal-content from parallax targets) */
        .parallax-slow{ will-change:transform; }
        .parallax-medium{ will-change:transform; }
        .parallax-fast{ will-change:transform; }

        /* End banner */
        #endBanner{
            position:fixed;
            left:50%;
            bottom:36px;
            transform:translateX(-50%) translateY(40px);
            background:linear-gradient(90deg, rgba(6,182,212,0.08), rgba(168,85,247,0.08));
            border:1px solid rgba(255,255,255,0.06);
            padding:.9rem 1.2rem;
            border-radius:12px;
            color:var(--text-secondary);
            font-weight:600;
            z-index:60;
            opacity:0;
            pointer-events:none;
            transition:all .45s cubic-bezier(.2,.9,.2,1);
            backdrop-filter: blur(6px);
        }
        #endBanner.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }

    </style>
</head>
<body>
    <!-- Stars Background -->
    <div class="stars-container parallax-slow" id="starsContainer"></div>

    <!-- Nebula Effects -->
    <div class="nebula nebula-1 parallax-medium"></div>
    <div class="nebula nebula-2 parallax-medium"></div>
    <div class="nebula nebula-3 parallax-slow"></div>

    <!-- Hero Section -->
    <section class="hero">
        <div class="cosmic-rings parallax-fast">
            <div class="cosmic-ring"></div>
            <div class="cosmic-ring"></div>
            <div class="cosmic-ring"></div>
        </div>

        <div class="hero-content parallax-fast">
            <p class="hero-subtitle">Journey Through Time</p>
            <h1 class="hero-title">
                <span class="line-1">PTSNS</span>
                <span class="line-2">University</span>
            </h1>
            <p class="hero-description">
                Embark on a cosmic journey through our cherished memories and historic moments
            </p>
            <div class="scroll-indicator">
                <span class="scroll-text">Scroll to launch</span>
                <div class="scroll-mouse">
                    <div class="scroll-dot"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Year Navigation -->
    <nav class="year-nav" id="yearNav">
        <button class="year-btn active" data-year="2024">2024</button>
        <button class="year-btn" data-year="2023">2023</button>
        <button class="year-btn" data-year="2022">2022</button>
        <button class="year-btn" data-year="2021">2021</button>
    </nav>

    <!-- Filter Section -->
    <section class="filter-section">
        <div class="filter-container">
            <span class="filter-label">Filter by:</span>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="All">All</button>
                <button class="filter-btn" data-filter="Academic">Academic</button>
                <button class="filter-btn" data-filter="Cultural">Cultural</button>
                <button class="filter-btn" data-filter="Technology">Technology</button>
                <button class="filter-btn" data-filter="Sports">Sports</button>
                <button class="filter-btn" data-filter="National">National</button>
                <button class="filter-btn" data-filter="Alumni">Alumni</button>
            </div>
        </div>
    </section>

    <!-- Timeline Section -->
    <section class="timeline-section" id="timelineSection">
        <div class="timeline-sticky">
            <!-- Track SVG -->
            <svg class="track-container" id="trackSvg" width="5000" height="360">
                <defs>
                    <linearGradient id="trackGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#06b6d4" />
                        <stop offset="50%" stop-color="#a855f7" />
                        <stop offset="100%" stop-color="#ec4899" />
                    </linearGradient>
                    <linearGradient id="trackGlow" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
                        <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3" />
                        <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3" />
                    </linearGradient>
                </defs>
                <path id="trackGlowPath" class="track-path track-glow" />
                <path id="trackMainPath" class="track-path track-main" />
            </svg>

            <!-- Train 
            <div class="train-container" id="trainContainer" aria-hidden="true">
                <div class="steam-container">
                    <div class="steam-particle"></div>
                    <div class="steam-particle"></div>
                    <div class="steam-particle"></div>
                    <div class="steam-particle"></div>
                    <div class="steam-particle"></div>
                    <div class="steam-particle"></div>
                </div>
                <div class="train-glow"></div>
                <svg class="train-svg" viewBox="0 0 18 109" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.955 1.772C3.439 0.694 4.51 0 5.692 0h6.616c1.182 0 2.254 0.694 2.737 1.772l1.641 3.658C17.552 7.361 18 9.417 18 11.533v82.967c0 4.42-1.875 8.531-3.694 12.485-0.493 1.073-1.565 1.765-2.746 1.765H6.44c-1.18 0-2.253-0.692-2.747-1.764C1.865 103.018 0 98.959 0 94.5V11.565c0-2.116 0.448-4.172 1.314-6.103l1.641-3.69z" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.7)"/>
                    <path d="M1.875 102s3 2.625 7.125 2.625S16.125 102 16.125 102" stroke="white"/>
                    <ellipse cx="9" cy="33.75" rx="2.25" ry="1.5" stroke="white"/>
                    <ellipse cx="9" cy="59.25" rx="2.25" ry="1.5" stroke="white"/>
                    <ellipse cx="9" cy="15.75" rx="2.25" ry="1.5" stroke="white"/>
                    <ellipse cx="9" cy="44.25" rx="2.25" ry="1.5" stroke="white"/>
                    <ellipse cx="9" cy="69.75" rx="2.25" ry="1.5" stroke="white"/>
                    <ellipse cx="9" cy="84" rx="2.25" ry="1.5" stroke="white"/>
                    <path opacity="0.5" d="M13.5 0.686V88.798" stroke="white" stroke-width="0.75"/>
                    <path opacity="0.5" d="M4.5 0.686V88.798" stroke="white" stroke-width="0.75"/>
                    <path d="M14.266 98.342l0.576-4.8c0.07-0.58-0.547-1.08-1.119-0.964-0.952 0.194-2.48 0.394-4.723 0.394s-3.77-0.2-4.723-0.394c-0.572-0.116-1.188 0.384-1.119 0.964l0.576 4.8c0.01 0.09 0.03 0.18 0.07 0.26 0.227 0.447 1.278 1.943 5.196 1.943s4.969-1.495 5.196-1.942c0.041-0.081 0.06-0.17 0.07-0.261z" fill="white"/>
                </svg>
            </div>  -->

            <!-- Horizontal Content -->
            <div class="horizontal-content" id="horizontalContent">
                <div class="spacer-start"></div>
                <div id="eventsContainer"></div>
                <div class="spacer-end">
                    <div class="end-content">
                        <div class="end-emoji">🚀</div>
                        <p class="end-text">More adventures await...</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- end banner -->
    <div id="endBanner"></div>

    <!-- Footer -->
    <footer class="footer">
        <p class="footer-text">© 2024 PTSNS University ChronoGallery</p>
        <p class="footer-subtext">Preserving memories across the cosmos</p>
    </footer>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
        <button class="lightbox-nav lightbox-prev" id="lightboxPrev">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <button class="lightbox-nav lightbox-next" id="lightboxNext">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
        <div class="lightbox-content">
            <img class="lightbox-image" id="lightboxImage" src="" alt="">
            <div class="lightbox-info">
                <h3 class="lightbox-title" id="lightboxTitle"></h3>
                <div class="lightbox-dots" id="lightboxDots"></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // DATA (unchanged)
        // ============================================
        const galleryData = [
            { year:2024, events:[
                { id:1, title:"Annual Convocation Ceremony", category:"Academic", date:"March 2024", location:"Main Auditorium", attendees:2500, description:"Celebrating the achievements of our graduating class with distinguished guests and alumni.", images:["https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=600","https://images.unsplash.com/photo-1627556704290-2b1f5853ff78?w=400","https://images.unsplash.com/photo-1541339907198-e08756dedf3f?w=400"] },
                { id:2, title:"Tech Innovation Summit", category:"Technology", date:"February 2024", location:"Innovation Hub", attendees:800, description:"Students showcasing cutting-edge projects and research innovations.", images:["https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=600","https://images.unsplash.com/photo-1475721027785-f74eccf877e2?w=400","https://images.unsplash.com/photo-1531482615713-2afd69097998?w=400"] }
            ]},
            { year:2023, events:[
                { id:3, title:"Cultural Festival - Utsav", category:"Cultural", date:"October 2023", location:"Campus Grounds", attendees:5000, description:"A vibrant celebration of art, music, and traditional performances.", images:["https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?w=600","https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=400","https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=400"] },
                { id:4, title:"Inter-University Sports Meet", category:"Sports", date:"August 2023", location:"Sports Complex", attendees:3000, description:"Athletes from across the nation competing for glory.", images:["https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=600","https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=400","https://images.unsplash.com/photo-1547347298-4074fc3086f0?w=400"] }
            ]},
            { year:2022, events:[
                { id:5, title:"Foundation Day Celebration", category:"National", date:"July 2022", location:"Heritage Hall", attendees:4000, description:"Commemorating our university's rich legacy and vision for the future.", images:["https://images.unsplash.com/photo-1523580494863-6f3031224c94?w=600","https://images.unsplash.com/photo-1559223607-b4d0555ae227?w=400","https://images.unsplash.com/photo-1524178232363-1fb2b075b655?w=400"] },
                { id:6, title:"Alumni Homecoming", category:"Alumni", date:"December 2022", location:"University Campus", attendees:1500, description:"Reconnecting generations of graduates with their alma mater.", images:["https://images.unsplash.com/photo-1529070538774-1843cb3265df?w=600","https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?w=400","https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=400"] }
            ]},
            { year:2021, events:[
                { id:7, title:"Virtual Graduation Ceremony", category:"Academic", date:"May 2021", location:"Online Platform", attendees:3500, description:"A historic virtual celebration during challenging times.", images:["https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=600","https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=400","https://images.unsplash.com/photo-1588072432836-e10032774f76?w=400"] }
            ]}
        ];

        // ============================================
        // STATE & ELEMENTS
        // ============================================
        let currentFilter = 'All';
        let lightboxState = { images:[], index:0, title:'' };

        const starsContainer = document.getElementById('starsContainer');
        const eventsContainer = document.getElementById('eventsContainer');
        const horizontalContent = document.getElementById('horizontalContent');
        const timelineSection = document.getElementById('timelineSection');
        const trackSvg = document.getElementById('trackSvg');
        const trackGlowPath = document.getElementById('trackGlowPath');
        const trackMainPath = document.getElementById('trackMainPath');
        const trainContainer = document.getElementById('trainContainer');
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxTitle = document.getElementById('lightboxTitle');
        const lightboxDots = document.getElementById('lightboxDots');
        const endBanner = document.getElementById('endBanner');

        // ============================================
        // STARS
        // ============================================
        function generateStars(){
            for(let i=0;i<220;i++){
                const star = document.createElement('div');
                star.className='star';
                const size = (Math.random()*2 + 0.6);
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = Math.random()*100 + '%';
                star.style.top = Math.random()*100 + '%';
                star.style.setProperty('--duration',(2 + Math.random()*4)+'s');
                star.style.setProperty('--delay',(Math.random()*3)+'s');
                star.dataset.parallax = (Math.random()*0.6 + 0.2).toFixed(2);
                starsContainer.appendChild(star);
            }

            window.addEventListener('scroll', ()=>{
                const sc = window.scrollY;
                document.querySelectorAll('.star').forEach(st=>{
                    const p = parseFloat(st.dataset.parallax);
                    st.style.transform = `translateY(${sc * p * 0.02}px)`;
                });
            });
        }

        // ============================================
        // WAVY PATH GENERATOR (lower baseline + richer curves)
        // ============================================
        function generateWavyPath(width){
            const baseline = Number(getComputedStyle(document.documentElement).getPropertyValue('--track-baseline')) || 150;
            let path = `M 0 ${baseline}`;
            for(let x=0;x<=width;x+=8){
                const longWave = Math.sin(x * 0.0016) * 110;
                const midWave = Math.sin(x * 0.0065) * 40;
                const shortWave = Math.cos(x * 0.018) * 12;
                const mod = Math.sin(x * 0.0038) * Math.sin(x * 0.0008) * 6;
                const y = baseline + longWave + midWave + shortWave + mod;
                path += ` L ${Math.round(x)} ${Math.round(y)}`;
            }
            return path;
        }

        // ============================================
        // RENDER EVENTS (kept)
        // ============================================
        function renderEvents(){
            eventsContainer.innerHTML = '';
            const filteredData = galleryData.map(yearData=>({...yearData, events: currentFilter==='All' ? yearData.events : yearData.events.filter(e=>e.category===currentFilter)})).filter(y=>y.events.length>0);
            filteredData.forEach(yearData=>{
                const yearSection = document.createElement('div');
                yearSection.className = 'year-section';
                const yearMarker = document.createElement('div');
                yearMarker.className='year-marker';
                yearMarker.innerHTML = `<div class="year-number">${yearData.year}</div><div class="year-orbit"></div>`;
                yearSection.appendChild(yearMarker);
                yearData.events.forEach(event=>{
                    const card = document.createElement('div');
                    card.className='event-card';
                    card.dataset.eventId = event.id;
                    const imagesHtml = event.images.map((img, idx)=>`
                        <div class="image-item" data-images='${JSON.stringify(event.images)}' data-index="${idx}" data-title="${event.title}">
                            <img src="${img}" alt="${event.title}" loading="lazy">
                            <div class="image-overlay"><span>View</span></div>
                        </div>`).join('');
                    card.innerHTML = `
                        <div class="image-grid">${imagesHtml}</div>
                        <div class="event-info">
                            <div class="event-meta">
                                <span class="event-category category-${event.category.toLowerCase()}">${event.category}</span>
                                <span class="event-date">${event.date}</span>
                            </div>
                            <h3 class="event-title">${event.title}</h3>
                            <p class="event-description">${event.description}</p>
                            <div class="event-details">
                                <div class="event-detail detail-calendar">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                        <line x1="16" y1="2" x2="16" y2="6"></line>
                                        <line x1="8" y1="2" x2="8" y2="6"></line>
                                        <line x1="3" y1="10" x2="21" y2="10"></line>
                                    </svg>
                                    ${event.date}
                                </div>
                                <div class="event-detail detail-location">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                        <circle cx="12" cy="10" r="3"></circle>
                                    </svg>
                                    ${event.location}
                                </div>
                                <div class="event-detail detail-attendees">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                        <circle cx="9" cy="7" r="4"></circle>
                                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                                    </svg>
                                    ${event.attendees.toLocaleString()}
                                </div>
                            </div>
                        </div>
                    `;
                    yearSection.appendChild(card);
                });
                eventsContainer.appendChild(yearSection);
            });

            const totalWidth = Math.max(eventsContainer.scrollWidth + window.innerWidth * 0.6, window.innerWidth * 2);
            trackSvg.setAttribute('width', totalWidth);
            trackSvg.style.width = totalWidth + 'px';
            const wavyPath = generateWavyPath(totalWidth);
            trackGlowPath.setAttribute('d', wavyPath);
            trackMainPath.setAttribute('d', wavyPath);

            // lightbox bind
            document.querySelectorAll('.image-item').forEach(item=>{
                item.addEventListener('click', ()=>{
                    const images = JSON.parse(item.dataset.images);
                    const index = parseInt(item.dataset.index);
                    const title = item.dataset.title;
                    openLightbox(images, index, title);
                });
            });

            // set dash arrays when ready
            setTimeout(()=>{
                try{
                    const pathLength = trackMainPath.getTotalLength();
                    trackGlowPath.style.strokeDasharray = pathLength;
                    trackGlowPath.style.strokeDashoffset = pathLength;
                    trackMainPath.style.strokeDasharray = pathLength;
                    trackMainPath.style.strokeDashoffset = pathLength;
                }catch(e){}
            },150);

            setTimeout(checkCardVisibility,120);
        }

        // ============================================
        // LERP helper
        // ============================================
        function lerp(a,b,t){ return a + (b - a) * t; }

        // ============================================
        // Smooth progress / train inertia globals
        // ============================================
        let targetProgress = 0;   // set on scroll
        let displayProgress = 0;  // smoothed
        let trainState = { targetLen:0, displayedLen:0, targetAngle:0, displayedAngle:0 };

        // main RAF loop that applies smoothed progress to horizontal scroll, track draw, train movement
        function mainRAF(){
            // smooth displayProgress toward targetProgress
            displayProgress = lerp(displayProgress, targetProgress, 0.12); // lower = more smoothing/lag

            // content width
            const contentWidth = Math.max(eventsContainer.scrollWidth + window.innerWidth * 0.6, window.innerWidth * 2);
            const scrollX = displayProgress * (contentWidth - window.innerWidth);

            // apply horizontal translate smoothly
            horizontalContent.style.transform = `translateX(-${scrollX}px)`;

            // track draw based on displayProgress (smooth)
            try{
                const pathLength = trackMainPath.getTotalLength();
                const drawLen = pathLength * displayProgress;
                const currentOffset = Math.max(0, pathLength - drawLen);
                trackGlowPath.style.strokeDashoffset = currentOffset;
                trackMainPath.style.strokeDashoffset = currentOffset;

                // set train target len
                trainState.targetLen = Math.min(drawLen, pathLength - 1);

                // train inertia for length
                trainState.displayedLen = lerp(trainState.displayedLen || 0, trainState.targetLen, 0.14);

                // compute p and next points
                const p = trackMainPath.getPointAtLength(Math.max(0, Math.min(trainState.displayedLen, pathLength - 1)));
                const ahead = trackMainPath.getPointAtLength(Math.max(0, Math.min(trainState.displayedLen + 8, pathLength - 1)));
                const angleRad = Math.atan2(ahead.y - p.y, ahead.x - p.x);
                const angleDeg = angleRad * 180 / Math.PI;

                // small overshoot based on difference between target and displayed (gives inertia on turns)
                const vel = trainState.targetLen - trainState.displayedLen;
                trainState.targetAngle = angleDeg + Math.sign(vel) * Math.min(8, Math.abs(vel) * 0.06);
                trainState.displayedAngle = lerp(trainState.displayedAngle || angleDeg, trainState.targetAngle, 0.14);

                // compute top offset relative to baseline and apply train-offset tweak
                const baseline = Number(getComputedStyle(document.documentElement).getPropertyValue('--track-baseline')) || 150;
                const trainOffset = Number(getComputedStyle(document.documentElement).getPropertyValue('--train-offset')) || 18;
                const leftPos = p.x;
                const topOffset = p.y - baseline - trainOffset;

                // set transform with rotation (train-svg already at 0°)
                trainContainer.style.transform = `translate(${leftPos}px, calc(-50% + ${topOffset}px)) rotate(${trainState.displayedAngle}deg)`;

            }catch(e){
                // path not ready
            }

            // active year update
            const years = [2024,2023,2022,2021];
            const yearIndex = Math.min(Math.floor(displayProgress * years.length), years.length - 1);
            updateActiveYear(years[yearIndex]);

            // end banner show
            if(displayProgress > 0.985){
                endBanner.classList.add('show');
            } else {
                endBanner.classList.remove('show');
            }

            requestAnimationFrame(mainRAF);
        }

        // ============================================
        // SCROLL HANDLER -> sets targetProgress only (no direct transform)
        // ============================================
        function handleScroll(){
            const rect = timelineSection.getBoundingClientRect();
            const sectionTop = rect.top;
            const sectionHeight = timelineSection.offsetHeight - window.innerHeight;
            let progress = 0;
            if(sectionTop <= 0){
                progress = Math.min(1, Math.abs(sectionTop) / sectionHeight);
            }
            targetProgress = progress;

            // visibility check triggered here (keeps card reveal correct)
            checkCardVisibility();
        }

        // ============================================
        // card visibility
        // ============================================
        function checkCardVisibility(){
            document.querySelectorAll('.event-card').forEach(card=>{
                const rect = card.getBoundingClientRect();
                if(rect.left < window.innerWidth && rect.right > 0) card.classList.add('visible');
            });
        }

        // ============================================
        // active year (glow)
        // ============================================
        function updateActiveYear(year){
            document.querySelectorAll('.year-btn').forEach(btn=>btn.classList.toggle('active', parseInt(btn.dataset.year)===year));
            document.querySelectorAll('.year-number').forEach(node=>{
                if(parseInt(node.textContent,10)===year) node.classList.add('glow'); else node.classList.remove('glow');
            });
        }

        // ============================================
        // Filters (kept)
        // ============================================
        document.querySelectorAll('.filter-btn').forEach(btn=>{
            btn.addEventListener('click', ()=>{
                document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderEvents();
                setTimeout(()=>{ handleScroll(); }, 200);
            });
        });

        // ============================================
        // Year nav (kept)
        // ============================================
        document.querySelectorAll('.year-btn').forEach(btn=>{
            btn.addEventListener('click', ()=>{
                const year = parseInt(btn.dataset.year);
                const years = [2024,2023,2022,2021];
                const index = years.indexOf(year);
                const sectionHeight = timelineSection.offsetHeight - window.innerHeight;
                const targetScroll = timelineSection.offsetTop + (index / (years.length - 1)) * sectionHeight;
                window.scrollTo({ top: targetScroll, behavior:'smooth' });
            });
        });

        // ============================================
        // Lightbox (kept)
        // ============================================
        function openLightbox(images, index, title){
            lightboxState = { images, index, title };
            updateLightbox();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeLightbox(){ lightbox.classList.remove('active'); document.body.style.overflow = ''; }
        function updateLightbox(){ lightboxImage.src = lightboxState.images[lightboxState.index]; lightboxTitle.textContent = lightboxState.title; lightboxDots.innerHTML = lightboxState.images.map((_,i)=>`<div class="lightbox-dot ${i===lightboxState.index ? 'active':''}"></div>`).join(''); }
        function navigateLightbox(dir){ lightboxState.index = (lightboxState.index + dir + lightboxState.images.length) % lightboxState.images.length; updateLightbox(); }
        document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
        document.getElementById('lightboxPrev').addEventListener('click', ()=>navigateLightbox(-1));
        document.getElementById('lightboxNext').addEventListener('click', ()=>navigateLightbox(1));
        lightbox.addEventListener('click', (e)=>{ if(e.target===lightbox) closeLightbox(); });
        document.addEventListener('keydown', (e)=>{ if(!lightbox.classList.contains('active')) return; if(e.key==='Escape') closeLightbox(); if(e.key==='ArrowLeft') navigateLightbox(-1); if(e.key==='ArrowRight') navigateLightbox(1); });

        // ============================================
        // CAMERA PARALLAX (mousemove + subtle scroll)
        // NOTE: horizontal-content REMOVED from parallax targets to avoid transform overwrite
        // ============================================
        const parallaxTargets = [
            { sel: '.nebula-1', strength: 0.03 },
            { sel: '.nebula-2', strength: 0.04 },
            { sel: '.nebula-3', strength: 0.02 },
            { sel: '.cosmic-ring', strength: 0.06 },
            { sel: '.hero-content', strength: 0.04 },
            { sel: '.stars-container', strength: 0.01 }
            // intentionally NOT including '.horizontal-content' — prevents jump-back behavior
        ];

        let mouse = { x:0, y:0 };
        window.addEventListener('mousemove', (e)=>{
            const nx = (e.clientX / window.innerWidth) * 2 - 1;
            const ny = (e.clientY / window.innerHeight) * 2 - 1;
            mouse.x = nx; mouse.y = ny;
            applyParallax();
        });

        function applyParallax(){
            parallaxTargets.forEach(t=>{
                const nodes = document.querySelectorAll(t.sel);
                nodes.forEach(n=>{
                    const tx = mouse.x * window.innerWidth * t.strength * -0.9;
                    const ty = mouse.y * window.innerHeight * t.strength * -0.45;
                    n.style.transform = `translate3d(${tx}px, ${ty}px, 0)`;
                });
            });
        }

        // scroll-based decorative parallax (keeps mild effect)
        window.addEventListener('scroll', ()=>{
            const s = window.scrollY;
            document.querySelectorAll('.nebula-1').forEach(n=>n.style.transform = `translate3d(${(s * -0.02)}px, ${(s * -0.04)}px,0)`);
            document.querySelectorAll('.nebula-2').forEach(n=>n.style.transform = `translate3d(${(s * 0.03)}px, ${(s * -0.02)}px,0)`);
            document.querySelectorAll('.stars-container').forEach(n=>n.style.transform = `translate3d(0, ${s * 0.02}px, 0)`);
        });

        // ============================================
        // INIT
        // ============================================
        generateStars();
        renderEvents();

        // handleScroll via RAF throttle
        let ticking = false;
        window.addEventListener('scroll', ()=>{
            if(!ticking){
                requestAnimationFrame(()=>{ handleScroll(); ticking=false; });
                ticking = true;
            }
        });

        // start main loop (smooth scroll, draw, train)
        requestAnimationFrame(mainRAF);

        // start train raf loop is merged into mainRAF, so no separate animateTrainLoop

        // initial layout pass
        setTimeout(()=>{
            handleScroll();
            applyParallax();
        }, 160);

        // resize recalc
        window.addEventListener('resize', ()=>{
            setTimeout(()=>{ renderEvents(); handleScroll(); }, 180);
        });

    </script>
