<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronoGallery – Timeline-Based Event Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ============================================
           CSS RESET & BASE STYLES
        ============================================ */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0d1117;
            --bg-darker: #090c10;
            --accent: #ff4d2a;
            --accent-glow: rgba(255, 77, 42, 0.3);
            --text-primary: #ffffff;
            --text-secondary: #8b949e;
            --text-muted: #484f58;
            --border-color: rgba(255, 255, 255, 0.05);
            --card-bg: rgba(255, 255, 255, 0.03);
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ============================================
           HERO SECTION
        ============================================ */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(255, 77, 42, 0.15) 0%, var(--bg-dark) 50%);
        }

        /* Floating Shapes */
        .floating-shapes {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            background: rgba(255, 77, 42, 0.08);
            animation: float 8s ease-in-out infinite;
        }

        .shape:nth-child(1) { width: 400px; height: 400px; top: -10%; left: 60%; animation-delay: 0s; }
        .shape:nth-child(2) { width: 300px; height: 300px; top: 20%; left: 10%; animation-delay: -2s; border-radius: 50%; }
        .shape:nth-child(3) { width: 200px; height: 200px; top: 60%; left: 80%; animation-delay: -4s; }
        .shape:nth-child(4) { width: 150px; height: 150px; top: 70%; left: 20%; animation-delay: -1s; border-radius: 50%; }
        .shape:nth-child(5) { width: 250px; height: 250px; top: 40%; left: 50%; animation-delay: -3s; }
        .shape:nth-child(6) { width: 100px; height: 100px; top: 10%; left: 30%; animation-delay: -5s; border-radius: 50%; }
        .shape:nth-child(7) { width: 180px; height: 180px; top: 80%; left: 60%; animation-delay: -2.5s; }
        .shape:nth-child(8) { width: 120px; height: 120px; top: 30%; left: 85%; animation-delay: -4.5s; border-radius: 50%; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(5deg); }
            66% { transform: translateY(10px) rotate(-3deg); }
        }

        /* Hero Content */
        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
        }

        .hero-title {
            font-size: clamp(3rem, 12vw, 9rem);
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 1;
            margin-bottom: 1.5rem;
            opacity: 0;
            transform: translateY(50px);
            animation: fadeInUp 1s ease forwards 0.3s;
        }

        .hero-title .accent {
            color: var(--accent);
        }

        .hero-subtitle {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 2rem;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease forwards 0.5s;
        }

        .scroll-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: var(--accent);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 0.7s;
        }

        .scroll-indicator svg {
            animation: bounce 1.5s infinite;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(8px); }
        }

        /* Year Navigation */
        .year-nav {
            position: fixed;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            opacity: 0;
            animation: fadeInRight 1s ease forwards 0.9s;
        }

        @keyframes fadeInRight {
            to {
                opacity: 1;
            }
        }

        .year-nav button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 700;
            font-family: var(--font-main);
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0.5rem;
        }

        .year-nav button:hover,
        .year-nav button.active {
            color: var(--accent);
            transform: scale(1.2);
        }

        /* ============================================
           FILTER SECTION
        ============================================ */
        .filter-section {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(13, 17, 23, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem 0;
        }

        .filter-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
        }

        .filter-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .filter-btn {
            padding: 0.625rem 1.25rem;
            border-radius: 50px;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            font-family: var(--font-main);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        /* ============================================
           TIMELINE SECTION
        ============================================ */
        .timeline-section {
            padding: 5rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .timeline {
            position: relative;
        }

        /* Timeline Line */
        .timeline::before {
            content: '';
            position: absolute;
            left: 2rem;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, var(--accent), rgba(255, 77, 42, 0.3), transparent);
        }

        @media (min-width: 768px) {
            .timeline::before {
                left: 50%;
                transform: translateX(-50%);
            }
        }

        /* Timeline Event */
        .timeline-event {
            position: relative;
            margin-bottom: 6rem;
            opacity: 0;
            transform: translateY(80px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .timeline-event.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @media (min-width: 768px) {
            .timeline-event {
                display: flex;
                align-items: flex-start;
            }

            .timeline-event:nth-child(even) {
                flex-direction: row-reverse;
            }
        }

        /* Timeline Dot */
        .timeline-dot {
            position: absolute;
            left: 2rem;
            transform: translateX(-50%);
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 0 0 4px var(--bg-dark), 0 0 20px var(--accent-glow);
        }

        .timeline-dot::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(2); opacity: 0; }
        }

        @media (min-width: 768px) {
            .timeline-dot {
                left: 50%;
            }
        }

        /* Year Display */
        .timeline-year {
            display: none;
        }

        @media (min-width: 768px) {
            .timeline-year {
                display: block;
                width: 50%;
                padding: 0 3rem;
                text-align: right;
            }

            .timeline-event:nth-child(even) .timeline-year {
                text-align: left;
            }

            .timeline-year-number {
                font-size: 5rem;
                font-weight: 900;
                color: rgba(255, 255, 255, 0.05);
                line-height: 1;
            }

            .timeline-year-month {
                color: var(--accent);
                font-weight: 600;
                margin-top: 0.5rem;
            }
        }

        /* Event Card */
        .event-card {
            margin-left: 4rem;
            background: var(--card-bg);
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: all 0.4s ease;
        }

        .event-card:hover {
            border-color: rgba(255, 77, 42, 0.3);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        @media (min-width: 768px) {
            .event-card {
                margin-left: 0;
                width: 50%;
                margin: 0 3rem;
            }
        }

        /* Image Grid */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: 4px;
        }

        .image-grid .image-item:first-child {
            grid-column: span 2;
            grid-row: span 2;
        }

        .image-item {
            position: relative;
            overflow: hidden;
            cursor: pointer;
            aspect-ratio: 1;
        }

        .image-item:first-child {
            aspect-ratio: auto;
        }

        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .image-item:hover img {
            transform: scale(1.1);
        }

        .image-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .image-item:hover .image-overlay {
            opacity: 1;
        }

        .image-overlay span {
            color: white;
            font-size: 0.875rem;
            font-weight: 600;
        }

        /* Event Info */
        .event-info {
            padding: 1.5rem;
        }

        .event-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }

        .event-category {
            display: inline-block;
            padding: 0.375rem 0.875rem;
            background: rgba(255, 77, 42, 0.15);
            color: var(--accent);
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .event-date-mobile {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        @media (min-width: 768px) {
            .event-date-mobile {
                display: none;
            }
        }

        .event-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }

        .event-description {
            color: var(--text-secondary);
            font-size: 0.9375rem;
            margin-bottom: 1.25rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .event-details {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .event-detail {
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .event-detail svg {
            width: 14px;
            height: 14px;
            opacity: 0.7;
        }

        /* ============================================
           LIGHTBOX
        ============================================ */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .lightbox.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            padding: 0.5rem;
            transition: color 0.3s ease;
            z-index: 10;
        }

        .lightbox-close:hover {
            color: white;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            padding: 1rem;
            transition: all 0.3s ease;
        }

        .lightbox-nav:hover {
            color: white;
            transform: translateY(-50%) scale(1.1);
        }

        .lightbox-prev { left: 1rem; }
        .lightbox-next { right: 1rem; }

        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 80vh;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .lightbox.active .lightbox-content {
            transform: scale(1);
        }

        .lightbox-image {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 2rem;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            border-radius: 0 0 8px 8px;
        }

        .lightbox-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .lightbox-meta {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .lightbox-dots {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .lightbox-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .lightbox-dot.active {
            background: var(--accent);
            width: 24px;
            border-radius: 4px;
        }

        /* ============================================
           FOOTER
        ============================================ */
        .footer {
            padding: 4rem 2rem;
            text-align: center;
            border-top: 1px solid var(--border-color);
        }

        .footer p {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* ============================================
           RESPONSIVE ADJUSTMENTS
        ============================================ */
        @media (max-width: 767px) {
            .year-nav {
                display: none;
            }

            .timeline::before {
                left: 1.5rem;
            }

            .timeline-dot {
                left: 1.5rem;
            }

            .event-card {
                margin-left: 3rem;
            }
        }

        /* ============================================
           LOADING STATES
        ============================================ */
        .image-item img {
            background: linear-gradient(90deg, #1a1f26 25%, #252b33 50%, #1a1f26 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Hide scrollbar but keep functionality */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-darker);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }


        /* ===================== ADDED: BACKGROUND ENHANCEMENTS =====================
           - canvas starfield with twinkle + shooting-stars
           - subtle animated nebula gradient overlay
           - all added safely at the end so original styles stay intact
        ========================================================================== */

        .bg-enhancements {
            position: fixed;
            inset: 0;
            z-index: -3; /* behind hero and shapes (hero-content uses z-index:10) */
            pointer-events: none;
            overflow: hidden;
            will-change: transform;
            mix-blend-mode: normal;
        }

        /* canvas covers whole viewport */
        #bgCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            transform: translateZ(0);
        }

        /* animated nebula gradient overlay (soft color shifts) */
        .nebula-layer {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(30% 30% at 10% 20%, rgba(255,77,42,0.08), transparent 15%),
                radial-gradient(35% 35% at 80% 25%, rgba(100, 60, 200, 0.06), transparent 20%),
                radial-gradient(40% 40% at 50% 80%, rgba(45,200,255,0.04), transparent 25%);
            mix-blend-mode: screen;
            opacity: 0.9;
            animation: nebulaShift 30s linear infinite;
            filter: blur(36px) saturate(1.1);
        }

        @keyframes nebulaShift {
            0% { transform: translate3d(0,0,0) scale(1); opacity: 0.9; filter: blur(36px) saturate(1.05); }
            50% { transform: translate3d(6%, -3%, 0) scale(1.02); opacity: 1; filter: blur(40px) saturate(1.15); }
            100% { transform: translate3d(0,0,0) scale(1); opacity: 0.9; filter: blur(36px) saturate(1.05); }
        }

        /* subtle vignette */
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(60% 60% at 50% 45%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.35) 70%);
            pointer-events: none;
            mix-blend-mode: multiply;
        }

        /* overlay stars sparkle using CSS for tiny ones (extra depth) */
        .sparkles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: radial-gradient(circle at 10% 20%, rgba(255,255,255,0.12) 0px, transparent 2px),
                              radial-gradient(circle at 70% 30%, rgba(255,255,255,0.08) 0px, transparent 2px),
                              radial-gradient(circle at 40% 60%, rgba(255,255,255,0.06) 0px, transparent 2px);
            background-repeat: no-repeat;
            opacity: 0.6;
            mix-blend-mode: screen;
            animation: sparklesFade 8s ease-in-out infinite;
        }

        @keyframes sparklesFade {
            0% { opacity: 0.25; transform: translateY(0); }
            50% { opacity: 0.8; transform: translateY(-6px); }
            100% { opacity: 0.25; transform: translateY(0); }
        }

        /* optional subtle color wash when user hovers hero */
        .hero:hover ~ .bg-enhancements .nebula-layer {
            animation-play-state: paused;
            filter: blur(30px) saturate(1.25);
        }

        /* small performance hint for mobile - reduce star density via class toggle in JS */
        @media (max-width: 600px) {
            .bg-enhancements { opacity: 0.85; }
        }

    </style>
</head>
<body>
    <!-- ===== ADDED BACKGROUND ENHANCEMENTS (kept separate, doesn't remove anything) ===== -->
    <div class="bg-enhancements" aria-hidden="true">
        <canvas id="bgCanvas"></canvas>
        <div class="nebula-layer"></div>
        <div class="sparkles"></div>
        <div class="vignette"></div>
    </div>

    <!-- Hero Section -->
    <section class="hero" id="hero">
        <div class="floating-shapes">
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
        </div>

        <div class="hero-content">
            <h1 class="hero-title">
                <span class="accent">PTSNS University </span>Gallery
            </h1>
            <p class="hero-subtitle">
                Journey through our university's cherished moments
            </p>
            <div class="scroll-indicator">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 9l6 6 6-6"/>
                </svg>
                <span>Scroll to explore</span>
            </div>
        </div>

        <!-- Year Navigation -->
        <nav class="year-nav" id="yearNav">
            <button data-year="2024">2024</button>
            <button data-year="2023">2023</button>
            <button data-year="2022">2022</button>
        </nav>
    </section>

    <!-- Filter Section -->
    <section class="filter-section">
        <div class="filter-container">
            <span class="filter-label">Filter by:</span>
            <div class="filter-buttons" id="filterButtons">
                <button class="filter-btn active" data-category="All">All</button>
                <button class="filter-btn" data-category="Academic">Academic</button>
                <button class="filter-btn" data-category="Cultural">Cultural</button>
                <button class="filter-btn" data-category="Technology">Technology</button>
                <button class="filter-btn" data-category="Sports">Sports</button>
                <button class="filter-btn" data-category="National">National</button>
                <button class="filter-btn" data-category="Alumni">Alumni</button>
            </div>
        </div>
    </section>

    <!-- Timeline Section -->
    <section class="timeline-section">
        <div class="timeline" id="timeline">
            <!-- Events will be injected by JavaScript -->
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2024 University ChronoGallery. Preserving memories, inspiring futures.</p>
    </footer>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" aria-label="Close">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
        </button>
        <button class="lightbox-nav lightbox-prev" aria-label="Previous">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </button>
        <button class="lightbox-nav lightbox-next" aria-label="Next">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6"/>
            </svg>
        </button>

    <script>
        // ============================================

        const eventsData = [

        // ============================================
        // DOM ELEMENTS
        // ============================================
        const timeline = document.getElementById('timeline');
        const filterButtons = document.getElementById('filterButtons');
        const yearNav = document.getElementById('yearNav');
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxTitle = document.getElementById('lightboxTitle');
        const lightboxMeta = document.getElementById('lightboxMeta');
        const lightboxDots = document.getElementById('lightboxDots');

        // ============================================
        // STATE
        // ============================================
        let currentFilter = 'All';
        let currentYear = null;
        let currentLightboxEvent = null;
        let currentLightboxIndex = 0;

        // ============================================
        // SVG ICONS
        // ============================================
        const icons = {
            location: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
            users: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
            calendar: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
        };

        // ============================================
        // RENDER FUNCTIONS
        // ============================================
        function renderTimeline() {
            let filteredEvents = eventsData;

            if (currentFilter !== 'All') {
                filteredEvents = filteredEvents.filter(e => e.category === currentFilter);
            }

            if (currentYear) {
                filteredEvents = filteredEvents.filter(e => e.year === currentYear);
            }

            timeline.innerHTML = filteredEvents.map((event, index) => `
                <div class="timeline-event" data-event-id="${event.id}">
                    <div class="timeline-dot"></div>
                    
                    <div class="timeline-year">
                        <span class="timeline-year-number">${event.year}</span>
                        <p class="timeline-year-month">${event.month}</p>
                    </div>
                    
                    <div class="event-card">
                        <div class="image-grid">
                            ${event.images.map((img, imgIndex) => `
                                <div class="image-item" onclick="openLightbox('${event.id}', ${imgIndex})">
                                    <img src="${img}" alt="${event.title} - Image ${imgIndex + 1}" loading="lazy">
                                    <div class="image-overlay">
                                        <span>View</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        
                        <div class="event-info">
                            <div class="event-meta">
                                <span class="event-category">${event.category}</span>
                                <span class="event-date-mobile">${event.month} ${event.year}</span>
                            </div>
                            <h3 class="event-title">${event.title}</h3>
                            <p class="event-description">${event.description}</p>
                            <div class="event-details">
                                <span class="event-detail">
                                    ${icons.location}
                                    ${event.location}
                                </span>
                                <span class="event-detail">
                                    ${icons.users}
                                    ${event.attendees.toLocaleString()} attendees
                                </span>
                                <span class="event-detail">
                                    ${icons.calendar}
                                    ${event.images.length} photos
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            // Trigger scroll animations
            setTimeout(observeEvents, 100);
        }

        // ============================================
        // INTERSECTION OBSERVER FOR ANIMATIONS
        // ============================================
        function observeEvents() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, {
                threshold: 0.1,
                rootMargin: '-50px'
            });

            document.querySelectorAll('.timeline-event').forEach(event => {
                observer.observe(event);
            });
        }

        // ============================================
        // FILTER HANDLERS
        // ============================================
        filterButtons.addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.category;
                renderTimeline();
            }
        });

        yearNav.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON') {
                const year = parseInt(e.target.dataset.year);
                
                if (currentYear === year) {
                    currentYear = null;
                    e.target.classList.remove('active');
                } else {
                    document.querySelectorAll('.year-nav button').forEach(btn => btn.classList.remove('active'));
                    e.target.classList.add('active');
                    currentYear = year;
                }
                
                renderTimeline();
            }
        });

        // ============================================
        // LIGHTBOX FUNCTIONS
        // ============================================
        function openLightbox(eventId, imageIndex) {
            const event = eventsData.find(e => e.id === eventId);
            if (!event) return;

            currentLightboxEvent = event;
            currentLightboxIndex = imageIndex;
            
            updateLightbox();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function updateLightbox() {
            if (!currentLightboxEvent) return;

            lightboxImage.src = currentLightboxEvent.images[currentLightboxIndex];
            lightboxTitle.textContent = currentLightboxEvent.title;
            lightboxMeta.textContent = `${currentLightboxEvent.month} ${currentLightboxEvent.year} • ${currentLightboxEvent.location}`;
            
            lightboxDots.innerHTML = currentLightboxEvent.images.map((_, index) => `
                <div class="lightbox-dot ${index === currentLightboxIndex ? 'active' : ''}"></div>
            `).join('');
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
            currentLightboxEvent = null;
        }

        function navigateLightbox(direction) {
            if (!currentLightboxEvent) return;
            
            const images = currentLightboxEvent.images;
            if (direction === 'next') {
                currentLightboxIndex = (currentLightboxIndex + 1) % images.length;
            } else {
                currentLightboxIndex = (currentLightboxIndex - 1 + images.length) % images.length;
            }
            
            updateLightbox();
        }

        // Lightbox event listeners
        document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
        document.querySelector('.lightbox-prev').addEventListener('click', () => navigateLightbox('prev'));
        document.querySelector('.lightbox-next').addEventListener('click', () => navigateLightbox('next'));

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            
            switch (e.key) {
                case 'Escape':
                    closeLightbox();
                    break;
                case 'ArrowRight':
                    navigateLightbox('next');
                    break;
                case 'ArrowLeft':
                    navigateLightbox('prev');
                    break;
            }
        });

        // ============================================
        // SMOOTH SCROLL FOR YEAR NAV
        // ============================================
        yearNav.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                const year = parseInt(btn.dataset.year);
                const firstEventOfYear = document.querySelector(`[data-event-id]`);
                if (firstEventOfYear) {
                    const offset = 200;
                    const elementPosition = firstEventOfYear.getBoundingClientRect().top;
                    const offsetPosition = elementPosition + window.pageYOffset - offset;
                    
                    window.scrollTo({
                        top: offsetPosition,
                        behavior: 'smooth'
                    });
                }
            });
        });

        // ============================================
        // PARALLAX EFFECT FOR SHAPES
        // ============================================
        let ticking = false;

        window.addEventListener('scroll', () => {
            if (!ticking) {
                window.requestAnimationFrame(() => {
                    const scrolled = window.pageYOffset;
                    const shapes = document.querySelectorAll('.shape');
                    
                    shapes.forEach((shape, index) => {
                        const speed = 0.05 + (index * 0.02);
                        shape.style.transform = `translateY(${scrolled * speed}px)`;
                    });
                    
                    ticking = false;
                });
                
                ticking = true;
            }
        });

        // ============================================
        // INITIALIZE
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            renderTimeline();
            initBackground(); // initialize added background animation
        });

        /* ============================================
           ADDED: Canvas starfield & shooting-stars
           - lightweight, optimized for desktop/mobile
           - auto reduce density on small screens
        ============================================ */
        function initBackground() {
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');
            let w = canvas.width = innerWidth;
            let h = canvas.height = innerHeight;
            let deviceRatio = Math.min(window.devicePixelRatio || 1, 2);

            const isMobile = window.matchMedia('(max-width: 600px)').matches;
            const starCount = isMobile ? 80 : 220; // reduce on mobile
            const stars = [];
            const shootingStars = [];

            function resizeCanvas() {
                w = canvas.width = innerWidth * deviceRatio;
                h = canvas.height = innerHeight * deviceRatio;
                canvas.style.width = innerWidth + 'px';
                canvas.style.height = innerHeight + 'px';
                ctx.scale(deviceRatio, deviceRatio);
            }

            window.addEventListener('resize', () => {
                deviceRatio = Math.min(window.devicePixelRatio || 1, 2);
                resizeCanvas();
            });

            function initStars() {
                stars.length = 0;
                for (let i = 0; i < starCount; i++) {
                    stars.push({
                        x: Math.random() * innerWidth,
                        y: Math.random() * innerHeight,
                        r: Math.random() * 1.5 + 0.3,
                        alpha: Math.random() * 0.9 + 0.1,
                        twinkle: Math.random() * 0.02 + 0.005,
                        hue: Math.random() > 0.7 ? 200 : 40 // mild color variation
                    });
                }
            }

            function spawnShootingStar() {
                // Random chance but spaced out
                if (Math.random() < 0.02) {
                    shootingStars.push({
                        x: Math.random() * innerWidth * 0.8 + innerWidth * 0.1,
                        y: Math.random() * innerHeight * 0.3 + 20,
                        len: Math.random() * 200 + 120,
                        speed: Math.random() * 6 + 6,
                        angle: Math.random() * 0.6 - 0.3,
                        life: 0,
                        ttl: Math.random() * 90 + 60
                    });
                }
            }

            function draw() {
                ctx.clearRect(0, 0, innerWidth, innerHeight);

                // faint color wash to give depth (subtle)
                const g = ctx.createLinearGradient(0, 0, innerWidth, innerHeight);
                g.addColorStop(0, 'rgba(10,12,20,0.12)');
                g.addColorStop(0.5, 'rgba(30,15,40,0.06)');
                g.addColorStop(1, 'rgba(5,10,20,0.12)');
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, innerWidth, innerHeight);

                // draw stars
                for (let s of stars) {
                    s.alpha += s.twinkle;
                    if (s.alpha > 1 || s.alpha < 0.05) s.twinkle *= -1;

                    ctx.beginPath();
                    const gradient = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 4);
                    gradient.addColorStop(0, `rgba(255,255,255,${s.alpha})`);
                    gradient.addColorStop(0.6, `hsla(${s.hue}, 80%, 60%, ${s.alpha * 0.4})`);
                    gradient.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = gradient;
                    ctx.arc(s.x, s.y, s.r * 2.2, 0, Math.PI * 2);
                    ctx.fill();
                }

                // draw shooting stars
                for (let i = shootingStars.length - 1; i >= 0; i--) {
                    const st = shootingStars[i];
                    st.x += Math.cos(st.angle) * st.speed;
                    st.y += Math.sin(st.angle) * st.speed + 1;
                    st.life++;

                    const gradient2 = ctx.createLinearGradient(st.x, st.y, st.x - st.len * Math.cos(st.angle), st.y - st.len * Math.sin(st.angle));
                    gradient2.addColorStop(0, 'rgba(255,255,255,0.95)');
                    gradient2.addColorStop(0.6, 'rgba(255,200,160,0.6)');
                    gradient2.addColorStop(1, 'rgba(255,200,160,0)');

                    ctx.strokeStyle = gradient2;
                    ctx.lineWidth = Math.max(1, Math.min(3, st.speed * 0.3));
                    ctx.beginPath();
                    ctx.moveTo(st.x, st.y);
                    ctx.lineTo(st.x - st.len * Math.cos(st.angle), st.y - st.len * Math.sin(st.angle));
                    ctx.stroke();

                    // little head glow
                    ctx.beginPath();
                    ctx.fillStyle = 'rgba(255,255,255,0.9)';
                    ctx.arc(st.x, st.y, 2.4, 0, Math.PI * 2);
                    ctx.fill();

                    if (st.life > st.ttl) shootingStars.splice(i, 1);
                }

                // occasionally spawn shooting star
                if (Math.random() < 0.015) spawnShootingStar();

                requestAnimationFrame(draw);
            }

            resizeCanvas();
            initStars();
            draw();

            // reduce workload when tab not visible
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    // stop animations by not requesting frames - we'll keep canvas static
                } else {
                    // nothing needed — draw loop continues
                }
            });

            // subtle parallax link: move background slightly with mouse for depth
            let mouseX = innerWidth / 2, mouseY = innerHeight / 2;
            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                const layer = document.querySelector('.nebula-layer');
                if (layer) {
                    const tx = (mouseX - innerWidth / 2) * 0.02;
                    const ty = (mouseY - innerHeight / 2) * 0.02;
                    layer.style.transform = `translate3d(${tx}px, ${ty}px, 0)`;
                }
            });
        }
